kind: Deployment
apiVersion: apps/v1

metadata:
  name: backend-space-app
  namespace: space
  labels:
    app: backend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend
    spec:
     containers:
      - name: backend-app
        image: shashank971/space-orbiters-backend:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "20m"
            memory: "50Mi"
          limits:
            cpu: "40m"
            memory: "100Mi"  

        startupProbe:
          httpGet:
            path: /
            port: 3000
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3  

        envFrom:
          - secretRef:
              name: space-secret
          - configMapRef:
              name: space-configmap     

      


