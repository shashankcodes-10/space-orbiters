kind: Deployment
apiVersion: apps/v1

metadata:
  name: frontend-mainapp
  namespace: space
  labels:
    app: main-app

spec:
  replicas: 1
  selector:
    matchLabels:
      app: main-app

  template:
    metadata:
      labels:
        app: main-app
    spec:
     containers:
      - name: frontend-mainapp
        image: shashank971/space-orbiters-main-app:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "20m"
            memory: "50Mi"
          limits:
            cpu: "40m"
            memory: "100Mi"  

        startupProbe:
          httpGet:
            path: /
            port: 80
          failureThreshold: 15
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3  
      


