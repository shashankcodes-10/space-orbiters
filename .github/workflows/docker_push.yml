name: Docker Push

on:
  workflow_call:

jobs:
  docker_push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: frontend/main-app
            image: space-orbiters-main-app

          - folder: frontend/solar-system
            image: space-orbiters-solar-system

          - folder: frontend/chatroom
            image: space-orbiters-chatroom

          - folder: backend
            image: space-orbiters-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.folder }}
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}-actions:latest