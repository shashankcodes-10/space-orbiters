name: DEPLOY

on:
  workflow_call:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: code checkout
        uses: actions/checkout@v7

      - name: docker login
        uses: docker/login-action@v4
        with: 
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: env file
        run: cp .env.example .env
     
      - name: docker compose up
        run: |
          docker compose pull
          docker compose up -d 